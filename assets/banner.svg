<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="45%" stop-color="#0a0e2a"/>
      <stop offset="100%" stop-color="#0d0221"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8a5cff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <circle cx="180" cy="150" r="220" fill="url(#glow)"/>
  <circle cx="1020" cy="150" r="220" fill="url(#glow)"/>

  <!-- neural network lattice -->
  <g stroke="#2a3a6a" stroke-width="1" opacity="0.55">
    <line x1="60" y1="60" x2="220" y2="120"/>
    <line x1="220" y1="120" x2="140" y2="220"/>
    <line x1="140" y1="220" x2="60" y2="60"/>
    <line x1="220" y1="120" x2="340" y2="70"/>
    <line x1="340" y1="70" x2="140" y2="220"/>
    <line x1="960" y1="70" x2="1100" y2="130"/>
    <line x1="1100" y1="130" x2="1020" y2="230"/>
    <line x1="1020" y1="230" x2="900" y2="180"/>
    <line x1="900" y1="180" x2="960" y2="70"/>
  </g>
  <g fill="#00f0ff">
    <circle cx="60" cy="60" r="3.5"/>
    <circle cx="220" cy="120" r="3.5"/>
    <circle cx="140" cy="220" r="3.5"/>
    <circle cx="340" cy="70" r="3.5"/>
    <circle cx="960" cy="70" r="3.5"/>
    <circle cx="1100" cy="130" r="3.5"/>
    <circle cx="1020" cy="230" r="3.5"/>
    <circle cx="900" cy="180" r="3.5"/>
  </g>

  <!-- title -->
  <text x="600" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700"
        text-anchor="middle" fill="url(#textGrad)" filter="url(#softGlow)">
    ROHIT JHA
  </text>
  <text x="600" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="4"
        text-anchor="middle" fill="#9fb3ff">
    AI ENGINEERING STUDENT &#183; DEEP LEARNING &#183; COMPUTER VISION
  </text>

  <!-- baseline circuit -->
  <path d="M0,260 L250,260 L280,240 L400,240 L430,260 L780,260 L810,240 L940,240 L970,260 L1200,260"
        fill="none" stroke="#8a5cff" stroke-width="2" opacity="0.6"/>
  <g fill="#00f0ff" opacity="0.9">
    <circle cx="280" cy="240" r="3"/>
    <circle cx="430" cy="260" r="3"/>
    <circle cx="810" cy="240" r="3"/>
    <circle cx="970" cy="260" r="3"/>
  </g>
</svg>

<svg width="1200" height="6" viewBox="0 0 1200 6" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8a5cff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-20%;120%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;220%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="6" fill="url(#sepGrad)"/>
</svg>

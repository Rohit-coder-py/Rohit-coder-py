<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04040c"/>
      <stop offset="100%" stop-color="#100a2e"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#6a3bff"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bg2)"/>

  <!-- orbiting ring (neural / AI motif) -->
  <circle cx="250" cy="230" r="150" fill="none" stroke="#2a3a6a" stroke-width="1" opacity="0.6"/>
  <circle cx="250" cy="230" r="110" fill="none" stroke="#2a3a6a" stroke-width="1" opacity="0.4"/>
  <g fill="#00f0ff">
    <circle cx="250" cy="80" r="4"><animateTransform attributeName="transform" type="rotate" from="0 250 230" to="360 250 230" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="230" r="3"><animateTransform attributeName="transform" type="rotate" from="0 250 230" to="360 250 230" dur="14s" repeatCount="indefinite"/></circle>
  </g>

  <!-- desk / monitor -->
  <rect x="140" y="180" width="220" height="140" rx="10" fill="#0c1230" stroke="#3a4a8a" stroke-width="2"/>
  <rect x="156" y="196" width="188" height="94" rx="4" fill="url(#screenGrad)" opacity="0.85" filter="url(#glow2)"/>
  <g stroke="#04040c" stroke-width="2" opacity="0.6">
    <line x1="168" y1="212" x2="240" y2="212"/>
    <line x1="168" y1="226" x2="300" y2="226"/>
    <line x1="168" y1="240" x2="260" y2="240"/>
    <line x1="168" y1="254" x2="310" y2="254"/>
    <line x1="168" y1="268" x2="220" y2="268"/>
  </g>
  <rect x="230" y="320" width="40" height="14" fill="#3a4a8a"/>
  <rect x="180" y="334" width="140" height="10" rx="4" fill="#20285a"/>

  <!-- keyboard -->
  <rect x="150" y="350" width="200" height="18" rx="4" fill="#0c1230" stroke="#3a4a8a" stroke-width="1.5"/>

  <!-- silhouette figure -->
  <circle cx="250" cy="140" r="30" fill="#0c1230" stroke="#00f0ff" stroke-width="2"/>
  <path d="M205,360 Q205,290 250,285 Q295,290 295,360 Z" fill="#0c1230" stroke="#8a5cff" stroke-width="2"/>

  <text x="250" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="3"
        text-anchor="middle" fill="#9fb3ff">BUILDING WITH AI</text>
</svg>
